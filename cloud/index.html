<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>国际关系研究系统</title>
  <script src="https://imgcache.qq.com/qcloud/tcbjs/1.6.8/tcb.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { color: #fff; text-align: center; margin-bottom: 30px; font-size: 28px; }
    .card {
      background: rgba(255,255,255,0.95);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
    input, select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
    }
    input:focus, select:focus { outline: none; border-color: #4a90d9; }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #4a90d9, #6a5acd);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { transform: translateY(-2px); }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .result {
      margin-top: 30px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 8px;
      display: none;
    }
    .result.show { display: block; }
    .result h3 { color: #333; margin-bottom: 15px; }
    .result-content { white-space: pre-wrap; line-height: 1.8; color: #555; }
    .loading { text-align: center; color: #666; display: none; }
    .loading.show { display: block; }
    .error { color: #e74c3c; text-align: center; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌏 国际关系研究系统</h1>
    <div class="card">
      <div class="form-group">
        <label>研究主题</label>
        <input type="text" id="topic" placeholder="例如：中美关系、俄乌冲突" value="中美关系">
      </div>
      <div class="form-group">
        <label>分析类型</label>
        <select id="analysisType">
          <option value="general">综合分析</option>
          <option value="history">历史背景</option>
          <option value="actors">主要参与者</option>
          <option value="trends">趋势预测</option>
        </select>
      </div>
      <button id="analyzeBtn" onclick="analyze()">开始分析</button>
      <div class="loading" id="loading">分析中，请稍候...</div>
      <div class="error" id="error"></div>
      <div class="result" id="result">
        <h3>分析结果</h3>
        <div class="result-content" id="resultContent"></div>
      </div>
    </div>
  </div>
  <script>
    const app = tcb.init({ env: 'cloud1-3gznkj5x063dce04' });
    
    async function analyze() {
      const topic = document.getElementById('topic').value.trim();
      const type = document.getElementById('analysisType').value;
      if (!topic) { alert('请输入研究主题'); return; }
      
      const btn = document.getElementById('analyzeBtn');
      const loading = document.getElementById('loading');
      const resultDiv = document.getElementById('result');
      const resultContent = document.getElementById('resultContent');
      const errorDiv = document.getElementById('error');
      
      btn.disabled = true;
      loading.classList.add('show');
      resultDiv.classList.remove('show');
      errorDiv.textContent = '';
      
      try {
        const res = await app.callFunction({
          name: 'ir-api',
          data: { action: 'analyze', topic, analysisType: type }
        });
        
        const result = res.result;
        
        if (result.success) {
          resultContent.textContent = result.result;
          resultDiv.classList.add('show');
        } else {
          errorDiv.textContent = result.error || '分析失败';
        }
      } catch (e) {
        errorDiv.textContent = '连接失败: ' + e.message;
      } finally {
        btn.disabled = false;
        loading.classList.remove('show');
      }
    }
  </script>
</body>
</html>
